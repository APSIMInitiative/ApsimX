name: Model validations
permissions:
  contents: read # access to check out code and install dependencies

env:
  ALL_APSIM_FILES: ""
  PAYLOAD_FOLDER_PATH: "/home/runner/work/ApsimX/ApsimX/Payload/"

# Determines when this workflow is triggered. 
on:
  pull_request_target:
    branches: [ master ]

jobs:
  run-model-validations:
    name: Validation Jobs Submitted
    if: github.repository_owner == 'APSIMInitiative'
    runs-on: ubuntu-latest
    env:
      ALL_APSIM_FILES: ""
    steps:
      - name: Checkout PR merge ref (PR head merged with master)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1
          allow-unsafe-pr-checkout: true

      - name: Check A.V.A is up
        run: bash ./.github/workflows/scripts/ava-scripts/check-ava-health.sh

      - name: Register pull request with validation API
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash ./.github/workflows/scripts/ava-scripts/open-validation-record.sh

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Make github workflow bash scripts executable
        run: chmod +x ./.github/workflows/scripts/*.sh

      - name: Build Models and APSIM.Workflow projects
        run: |
          cd Models && dotnet publish -f net10.0 -o ../app && cd ../APSIM.Workflow && dotnet publish -f net10.0 -o ../app

      - name: Upload Artifacts
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          INCOMING_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          AZURE_ENV_CONTENTS: ${{ secrets.AZURE_ENV_CONTENTS }}
        run: ./.github/workflows/scripts/split-large-files.sh
        continue-on-error: true 

      - name: Start validation process
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash ./.github/workflows/scripts/ava-scripts/start-validation.sh

      - name: Create Azure Validation Jobs
        id: submit_azure_jobs
        env:
          PAYLOAD_FOLDER_PATH: ${{ env.PAYLOAD_FOLDER_PATH }}
          AZURE_ENV_CONTENTS: ${{ secrets.AZURE_ENV_CONTENTS }}
          DOCKER_METADATA_OUTPUT_VERSION: ${{ fromJSON(steps.meta_apsimplusr.outputs.json).labels['org.opencontainers.image.version'] }}
          INCOMING_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.actor }}
          SOYBEAN_PASSWORD: ${{ secrets.SOYBEAN_PASSWORD }}
          CORNSOY_PASSWORD: ${{ secrets.CORNSOY_PASSWORD }}
          SWIM_PASSWORD: ${{ secrets.SWIM_PASSWORD }}
          MAIZE_PASSWORD: ${{ secrets.MAIZE_PASSWORD }}
          RICE_PASSWORD: ${{ secrets.RICE_PASSWORD }}
          THINZAR_RYEGRASS_PASSWORD: ${{ secrets.THINZAR_RYEGRASS_PASSWORD }}
          UOM_WINTER_SPRING_PASSWORD: ${{ secrets.UOM_WINTER_SPRING_PASSWORD }}
        run: ./.github/workflows/scripts/create-azure-jobs.sh 

      - name: Print workflow submit success summary markdown
        if: success()
        run: |
          echo "## Workflow submit success summary :tada:" >> $GITHUB_STEP_SUMMARY
          echo 'All jobs submitted to Azure successfully!' >> $GITHUB_STEP_SUMMARY
          echo 'Run logs and predicted/observed metrics for this validation run can be viewed at [POStats2](https://postats2.apsim.info/${{ github.event.pull_request.number }})' >> $GITHUB_STEP_SUMMARY
          echo 'Note: The validation results may take some time to appear.' >> $GITHUB_STEP_SUMMARY

      - name: Print workflow submit failure summary markdown
        if: failure()
        run: |
          echo "## Validation workflow failure summary :sob:" >> $GITHUB_STEP_SUMMARY
          echo "The validation workflow failed. Check the failed step's logs for details." >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo 'Validation logs, if available, can be viewed at [POStats2](https://postats2.apsim.info/${{ github.event.pull_request.number }})' >> $GITHUB_STEP_SUMMARY
